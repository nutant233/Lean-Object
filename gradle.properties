mod_description=Memory-footprint optimizations for Minecraft 1.20.1 Forge.\nLeanObject interns and deduplicates the immutable objects that Minecraft and its mods recreate over and over, so the same logical value ends up as one shared instance instead of thousands of copies. Interning also makes field and map comparisons mostly reference checks, which cuts both heap usage and CPU churn.\nFeatures (each can be turned off in config/leanobject.toml):\n- ResourceLocation string interning for namespace, path and model variant strings\n- TagKey deduplication plus identity equals/hashCode\n- ResourceKey deduplication plus identity equals\n- Ingredient deduplication: single entry ingredients reuse one shared instance\n- Compact containers for NBT compounds and lists\n- Leaner block and item model object containers\n- AE2 storage key deduplication (needs AE2 installed)\n- Farmer's Delight tool action ingredient caching\nSafe by default: every feature has a master switch, and the rewrite paths can be swapped for non-destructive injections via safeMode when another mod conflicts.
