mod_group_id=nutant
mod_authors=nutant233
mod_description=Performance optimizations for Minecraft 1.21.1 NeoForge.\nLeanObject deduplicates the immutable objects that Minecraft and its mods recreate over and over, so the same logical value ends up as one shared instance instead of thousands of copies. Once a value exists exactly once, equals can be reduced to a reference compare and hashCode to an identity hash, which makes the hash lookups that dominate registries, tag checks and recipe matching much cheaper.\nFeatures (each can be turned off in config/leanobject.toml):\n- TagKey deduplication plus identity equals/hashCode\n- ResourceKey deduplication and faster creation
