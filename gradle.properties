mod_description=Performance optimizations for Minecraft 1.21.1 NeoForge.\nLeanObject deduplicates the immutable objects that Minecraft and its mods recreate over and over, so the same logical value ends up as one shared instance instead of thousands of copies. Once a value exists only once, equals can be reduced to a reference compare and hashCode to an identity hash, which makes the hash lookups that dominate registries, tag checks and recipe matching much cheaper.\nEvery feature is written to config/leanobject.toml on first launch and can be turned off there:\n- resourceKey: ResourceKey deduplication and faster creation\n- tagKey: TagKey deduplication, with identity equals/hashCode\n- resourceLocation: one ResourceLocation per namespace:path, with identity equals/hashCode\n- ingredient: one Ingredient per single item or per tag, so its lazily built itemStacks array exists once per game\n- nbt: CompoundTag and ListTag backed by leaner maps and lists\n- model: the model bakery and the baked models on more compact containers (client side)\n- aeKey: AE2 storage key deduplication with identity equals/hashCode (needs Applied Energistics 2, skipped without it)\nCompatibility:\n- FerriteCore: its ModelResourceLocation cache is switched off while resourceLocation is enabled, because both would redirect the same call\n- Applied Energistics 2 and FerriteCore are optional; no other mod is required
